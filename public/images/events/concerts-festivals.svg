<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="c-bg" x1="0" y1="0" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E1A14" />
      <stop offset="40%" stop-color="#142B20" />
      <stop offset="70%" stop-color="#244A37" />
      <stop offset="100%" stop-color="#3A6E53" />
    </linearGradient>
    <radialGradient id="c-stage-blast" cx="300" cy="220" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFEBB3" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#D9A84E" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#4E8C6A" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#142B20" stop-opacity="0" />
    </radialGradient>
    <filter id="c-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>

  <!-- Dark Atmospheric Festival Grounds Background -->
  <rect width="600" height="380" fill="url(#c-bg)" />

  <!-- Dynamic Sweeping Concert Spotlights -->
  <g opacity="0.45">
    <polygon points="300,210 60,0 160,0" fill="#FFEAA8" filter="url(#c-glow)" />
    <polygon points="300,210 240,0 360,0" fill="#FFF2CC" filter="url(#c-glow)" />
    <polygon points="300,210 440,0 540,0" fill="#FFEAA8" filter="url(#c-glow)" />
    <!-- Secondary Cross Beams -->
    <polygon points="120,230 400,0 480,0" fill="#75C29B" opacity="0.4" filter="url(#c-glow)" />
    <polygon points="480,230 120,0 200,0" fill="#75C29B" opacity="0.4" filter="url(#c-glow)" />
  </g>

  <!-- Main Stage Truss Structure & Lighting Rig -->
  <g stroke="#D9A84E" stroke-opacity="0.7" stroke-width="1.5" fill="none">
    <!-- Main Rig Horizontal Truss -->
    <rect x="140" y="140" width="320" height="14" fill="#0E1A14" stroke="#D9A84E" stroke-width="1.2" />
    <line x1="140" y1="147" x2="460" y2="147" stroke-dasharray="4 4" />
    <!-- Vertical Towers -->
    <line x1="160" y1="154" x2="160" y2="280" stroke-width="2" />
    <line x1="440" y1="154" x2="440" y2="280" stroke-width="2" />
    <!-- Cross Bracing -->
    <path d="M 160 154 L 180 280 M 180 154 L 160 280" stroke-opacity="0.3" />
    <path d="M 440 154 L 420 280 M 420 154 L 440 280" stroke-opacity="0.3" />
  </g>

  <!-- Central Stage Core Lighting Flare -->
  <circle cx="300" cy="210" r="160" fill="url(#c-stage-blast)" />
  <ellipse cx="300" cy="210" rx="35" ry="12" fill="#FFFFFF" filter="url(#c-glow)" />

  <!-- Animated Sound Waves Silhouette Graphic -->
  <g stroke="#FFE89E" stroke-width="1.8" fill="none" opacity="0.75">
    <path d="M 80 200 Q 140 160 200 200 T 320 200 T 440 200 T 520 200" />
    <path d="M 80 215 Q 140 185 200 215 T 320 215 T 440 215 T 520 215" stroke="#75C29B" stroke-width="1" />
  </g>

  <!-- Energetic Crowd Silhouette with Raised Hands -->
  <g fill="#080F0B">
    <!-- Base Crowd Layer -->
    <path d="M 0 380 L 0 290 Q 60 270 120 285 Q 180 265 240 280 Q 300 255 360 275 Q 420 260 480 285 Q 540 270 600 290 L 600 380 Z" />
    
    <!-- Raised Hands & Wristbands Silhouette Details -->
    <!-- Hand 1 -->
    <path d="M 115 285 L 118 245 L 124 245 L 126 285 Z" />
    <circle cx="121" cy="252" r="3" fill="#D9A84E" />
    <!-- Hand 2 -->
    <path d="M 215 280 L 217 235 L 223 235 L 225 280 Z" />
    <circle cx="220" cy="242" r="3.5" fill="#75C29B" />
    <!-- Hand 3 (Center) -->
    <path d="M 295 265 L 297 225 L 305 225 L 307 265 Z" />
    <circle cx="301" cy="232" r="4" fill="#FFEAA8" />
    <!-- Hand 4 -->
    <path d="M 375 275 L 377 238 L 383 238 L 385 275 Z" />
    <circle cx="380" cy="245" r="3.5" fill="#75C29B" />
    <!-- Hand 5 -->
    <path d="M 480 285 L 482 248 L 488 248 L 490 285 Z" />
    <circle cx="485" cy="255" r="3" fill="#D9A84E" />
  </g>

  <!-- Overlaid Realistic Client Microsite Card Frame -->
  <g transform="translate(130, 24)">
    <rect width="340" height="96" rx="6" fill="#FAF6ED" stroke="#D9A84E" stroke-width="1.2" />
    <rect x="0" y="0" width="340" height="24" rx="6" fill="#142B20" />
    <circle cx="12" cy="12" r="3" fill="#E06C53" />
    <circle cx="22" cy="12" r="3" fill="#E5B95A" />
    <circle cx="32" cy="12" r="3" fill="#62A375" />
    
    <rect x="70" y="4" width="200" height="16" rx="3" fill="#0E1A14" />
    <text x="170" y="15" font-family="'Aptos', sans-serif" font-size="7.5" fill="#D9A84E" text-anchor="middle">🔒 momentus.events/solstice-live</text>
    
    <text x="170" y="44" font-family="'Iowan Old Style', Georgia, serif" font-size="14" font-weight="600" fill="#263F35" text-anchor="middle" letter-spacing="0.5">Solstice Sunset Music Festival</text>
    <text x="170" y="58" font-family="'Aptos', sans-serif" font-size="8" fill="#75C29B" text-anchor="middle" letter-spacing="1.5">MAIN STAGE GROUNDS · CIRCUIT MAKATI</text>
    
    <rect x="95" y="68" width="150" height="18" rx="9" fill="#142B20" />
    <text x="170" y="80" font-family="'Aptos', sans-serif" font-size="7.5" font-weight="700" fill="#FFEAA8" text-anchor="middle" letter-spacing="1">⚡ 2,800 NFC WRISTBANDS SYNCED</text>
  </g>
</svg>
