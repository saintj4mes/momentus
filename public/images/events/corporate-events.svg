<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="corp-sky" x1="0" y1="0" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15222E" />
      <stop offset="40%" stop-color="#1E3342" />
      <stop offset="80%" stop-color="#284457" />
      <stop offset="100%" stop-color="#141E26" />
    </linearGradient>
    <linearGradient id="corp-stage-glow" x1="300" y1="200" x2="300" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#2563EB" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="corp-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5E4B5" />
      <stop offset="50%" stop-color="#CBB184" />
      <stop offset="100%" stop-color="#9E804D" />
    </linearGradient>
    <filter id="corp-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Deep Corporate Summit Auditorium Background -->
  <rect width="600" height="380" fill="url(#corp-sky)" />

  <!-- Keynote Overhead Stage Beams -->
  <g opacity="0.4">
    <polygon points="120,0 220,0 320,280 80,280" fill="url(#corp-gold)" opacity="0.12" />
    <polygon points="480,0 380,0 280,280 520,280" fill="#38BDF8" opacity="0.15" />
    <line x1="170" y1="0" x2="200" y2="280" stroke="#F5E4B5" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="430" y1="0" x2="400" y2="280" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <!-- Giant Curved LED Stage Screen Backdrop -->
  <path d="M 80 180 Q 300 160 520 180 L 520 280 Q 300 260 80 280 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5" />
  <!-- Dynamic Digital Grid on Stage Screen -->
  <g stroke="#38BDF8" stroke-opacity="0.25" stroke-width="0.8">
    <line x1="120" y1="185" x2="120" y2="275" />
    <line x1="180" y1="180" x2="180" y2="270" />
    <line x1="240" y1="176" x2="240" y2="266" />
    <line x1="300" y1="175" x2="300" y2="265" />
    <line x1="360" y1="176" x2="360" y2="266" />
    <line x1="420" y1="180" x2="420" y2="270" />
    <line x1="480" y1="185" x2="480" y2="275" />
    <line x1="90" y1="210" x2="510" y2="210" />
    <line x1="85" y1="240" x2="515" y2="240" />
  </g>

  <!-- Stage Screen Title Projection -->
  <text x="300" y="215" font-family="'Aptos', sans-serif" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="4">APEX GLOBAL '26</text>
  <text x="300" y="235" font-family="'Aptos', sans-serif" font-size="8" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">KEYNOTE · THE FUTURE OF SCALE</text>

  <!-- Stage Platform & Floor Glow -->
  <ellipse cx="300" cy="285" rx="260" ry="35" fill="url(#corp-stage-glow)" />
  <ellipse cx="300" cy="285" rx="250" ry="25" fill="#0F172A" stroke="#CBB184" stroke-width="1" />

  <!-- Speaker Podium with Gooseneck Microphones -->
  <g transform="translate(280, 240)">
    <rect width="40" height="44" rx="2" fill="#1E293B" stroke="#94A3B8" stroke-width="1" />
    <rect x="3" y="3" width="34" height="6" fill="#38BDF8" fill-opacity="0.8" />
    <line x1="12" y1="0" x2="10" y2="-12" stroke="#CBD5E1" stroke-width="1.2" />
    <circle cx="10" cy="-13" r="1.5" fill="#38BDF8" />
    <line x1="28" y1="0" x2="30" y2="-12" stroke="#CBD5E1" stroke-width="1.2" />
    <circle cx="30" cy="-13" r="1.5" fill="#38BDF8" />
  </g>

  <!-- Executive Audience Silhouettes in Tiered Theater Seating -->
  <g fill="#0B1118">
    <ellipse cx="140" cy="345" rx="18" ry="14" />
    <ellipse cx="140" cy="375" rx="36" ry="24" />
    <ellipse cx="220" cy="342" rx="19" ry="15" />
    <ellipse cx="220" cy="372" rx="38" ry="25" />
    <ellipse cx="300" cy="340" rx="20" ry="16" />
    <ellipse cx="300" cy="370" rx="40" ry="26" />
    <ellipse cx="380" cy="342" rx="19" ry="15" />
    <ellipse cx="380" cy="372" rx="38" ry="25" />
    <ellipse cx="460" cy="345" rx="18" ry="14" />
    <ellipse cx="460" cy="375" rx="36" ry="24" />
    <!-- Secondary Row -->
    <ellipse cx="80" cy="358" rx="17" ry="13" fill="#080D13" />
    <ellipse cx="520" cy="358" rx="17" ry="13" fill="#080D13" />
  </g>

  <!-- Floating Microsite Preview Card Header (Browser Mockup Overlaid) -->
  <g transform="translate(130, 24)">
    <!-- Browser Top Bar Container -->
    <rect width="340" height="96" rx="6" fill="#FAF6ED" stroke="#CBB184" stroke-width="1.2" />
    <rect x="0" y="0" width="340" height="24" rx="6" fill="#1E3342" />
    
    <!-- Window controls -->
    <circle cx="12" cy="12" r="3" fill="#E06C53" />
    <circle cx="22" cy="12" r="3" fill="#E5B95A" />
    <circle cx="32" cy="12" r="3" fill="#62A375" />
    
    <!-- URL Pill -->
    <rect x="70" y="4" width="200" height="16" rx="3" fill="#111F28" />
    <text x="170" y="15" font-family="'Aptos', sans-serif" font-size="7.5" fill="#38BDF8" text-anchor="middle">🔒 momentus.events/apex-summit</text>
    
    <!-- Microsite Content Preview -->
    <text x="170" y="44" font-family="'Iowan Old Style', Georgia, serif" font-size="14" font-weight="600" fill="#1E3342" text-anchor="middle" letter-spacing="0.5">Apex Global Technology Summit</text>
    <text x="170" y="58" font-family="'Aptos', sans-serif" font-size="8" fill="#8C5C48" text-anchor="middle" letter-spacing="1.5">EXECUTIVE PLENARY · SHANGRI-LA THE FORT BGC</text>
    
    <!-- Live Badge Scan Pill Tag -->
    <rect x="100" y="68" width="140" height="18" rx="9" fill="#1E3342" />
    <text x="170" y="80" font-family="'Aptos', sans-serif" font-size="7.5" font-weight="700" fill="#F6F1E7" text-anchor="middle" letter-spacing="1">✓ 520 DELEGATES RFID-ISSUED</text>
  </g>

  <!-- Lens Flare Glint -->
  <circle cx="200" cy="170" r="12" fill="#38BDF8" fill-opacity="0.25" filter="url(#corp-blur)" />
  <circle cx="440" cy="200" r="16" fill="#F5E4B5" fill-opacity="0.2" filter="url(#corp-blur)" />
</svg>
