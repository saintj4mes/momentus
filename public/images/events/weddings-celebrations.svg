<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="w-sky" x1="0" y1="0" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A342B" />
      <stop offset="35%" stop-color="#8C5C48" />
      <stop offset="70%" stop-color="#D49A70" />
      <stop offset="100%" stop-color="#F2D1A8" />
    </linearGradient>
    <linearGradient id="w-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5E4B5" />
      <stop offset="50%" stop-color="#CBB184" />
      <stop offset="100%" stop-color="#8C6E3D" />
    </linearGradient>
    <radialGradient id="w-candle-glow" cx="300" cy="270" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF2D6" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#E5AD7A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D49A70" stop-opacity="0" />
    </radialGradient>
    <filter id="w-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Sky & Twilight Golden Hour Gradient -->
  <rect width="600" height="380" fill="url(#w-sky)" />

  <!-- Historic Intramuros Courtyard Arches Silhouette -->
  <g fill="#2B1F19" fill-opacity="0.95">
    <!-- Left Arches -->
    <path d="M 0 380 L 0 160 Q 30 140 60 160 L 60 380 Z" />
    <path d="M 60 380 L 60 170 Q 95 150 130 170 L 130 380 Z" />
    <!-- Center Courtyard Wall -->
    <path d="M 130 380 L 130 200 Q 215 170 300 200 Q 385 170 470 200 L 470 380 Z" />
    <!-- Right Arches -->
    <path d="M 470 380 L 470 170 Q 505 150 540 170 L 540 380 Z" />
    <path d="M 540 380 L 540 160 Q 570 140 600 160 L 600 380 Z" />
    <!-- Upper Balcony & Spanish Tile Roofline -->
    <rect x="0" y="145" width="600" height="12" fill="#1C1410" />
    <line x1="0" y1="140" x2="600" y2="140" stroke="#8C5C48" stroke-width="2" />
  </g>

  <!-- Fairy Lights Canopy Hanging Above -->
  <g stroke="#FFF6DE" stroke-width="1.2" stroke-opacity="0.65" fill="none">
    <path d="M 0 60 Q 150 120 300 95 Q 450 130 600 70" />
    <path d="M 0 90 Q 180 150 300 130 Q 420 160 600 100" stroke-opacity="0.45" />
    <path d="M 0 120 Q 200 180 300 165 Q 400 190 600 130" stroke-opacity="0.3" />
  </g>

  <!-- Glowing Fairy Bulbs (warm bokeh effect) -->
  <g fill="#FFF8E7">
    <circle cx="80" cy="85" r="4" filter="url(#w-blur)" fill-opacity="0.9" />
    <circle cx="80" cy="85" r="2.5" />
    <circle cx="160" cy="115" r="5" filter="url(#w-blur)" fill-opacity="0.95" />
    <circle cx="160" cy="115" r="3" />
    <circle cx="230" cy="108" r="4.5" filter="url(#w-blur)" fill-opacity="0.9" />
    <circle cx="230" cy="108" r="2.5" />
    <circle cx="310" cy="98" r="5.5" filter="url(#w-blur)" fill-opacity="0.95" />
    <circle cx="310" cy="98" r="3.5" />
    <circle cx="390" cy="120" r="4.5" filter="url(#w-blur)" fill-opacity="0.9" />
    <circle cx="390" cy="120" r="2.8" />
    <circle cx="470" cy="110" r="5" filter="url(#w-blur)" fill-opacity="0.95" />
    <circle cx="470" cy="110" r="3" />
    <circle cx="540" cy="88" r="4" filter="url(#w-blur)" fill-opacity="0.9" />
    <circle cx="540" cy="88" r="2.5" />
  </g>

  <!-- Warm Table Candlelight Glow in Center Courtyard -->
  <circle cx="300" cy="270" r="160" fill="url(#w-candle-glow)" />

  <!-- Elegant Seated Banquet Table with Floral Garland -->
  <g>
    <!-- Long Banquet Table Platform -->
    <ellipse cx="300" cy="310" rx="210" ry="36" fill="#1C1410" stroke="#CBB184" stroke-width="1.2" />
    <ellipse cx="300" cy="307" rx="195" ry="30" fill="#F8F3EA" />

    <!-- Tablecloth Fringe & Gold Trim -->
    <path d="M 105 310 Q 300 355 495 310 L 495 324 Q 300 368 105 324 Z" fill="#CBB184" fill-opacity="0.8" />

    <!-- Lush Floral Centerpiece Arrangement (White Roses & Olive Eucalyptus) -->
    <g fill="#2D4033">
      <ellipse cx="300" cy="298" rx="130" ry="12" fill="#3D5344" />
      <!-- Floral highlights -->
      <circle cx="240" cy="295" r="6" fill="#FFFDF8" stroke="#E2D1B8" stroke-width="1" />
      <circle cx="270" cy="293" r="7" fill="#F6EFE3" stroke="#E2D1B8" stroke-width="1" />
      <circle cx="300" cy="291" r="8" fill="#FFFDF8" stroke="#CBB184" stroke-width="1.2" />
      <circle cx="330" cy="293" r="7" fill="#F6EFE3" stroke="#E2D1B8" stroke-width="1" />
      <circle cx="360" cy="295" r="6" fill="#FFFDF8" stroke="#E2D1B8" stroke-width="1" />
      <!-- Terracotta Rose accents -->
      <circle cx="285" cy="297" r="4" fill="#A66B54" />
      <circle cx="315" cy="297" r="4" fill="#A66B54" />
    </g>

    <!-- Candlesticks & Flickering Tapers -->
    <g stroke="#CBB184" stroke-width="1.8" fill="none">
      <line x1="210" y1="300" x2="210" y2="255" />
      <line x1="390" y1="300" x2="390" y2="255" />
      <!-- Candle Flame -->
      <circle cx="210" cy="250" r="3.5" fill="#FFE29A" filter="url(#w-blur)" />
      <circle cx="210" cy="250" r="2" fill="#FFFFFF" />
      <circle cx="390" cy="250" r="3.5" fill="#FFE29A" filter="url(#w-blur)" />
      <circle cx="390" cy="250" r="2" fill="#FFFFFF" />
    </g>

    <!-- Wine Glasses & Silverware Shimmer -->
    <g stroke="#FFFDF8" stroke-width="0.9" stroke-opacity="0.8" fill="none">
      <ellipse cx="170" cy="302" rx="4" ry="2" />
      <ellipse cx="230" cy="305" rx="4" ry="2" />
      <ellipse cx="370" cy="305" rx="4" ry="2" />
      <ellipse cx="430" cy="302" rx="4" ry="2" />
    </g>
  </g>

  <!-- Floating Microsite Preview Card Header (Browser / App Mockup Overlaid) -->
  <g transform="translate(130, 24)">
    <!-- Browser Top Bar Container -->
    <rect width="340" height="96" rx="6" fill="#FAF6ED" stroke="#CBB184" stroke-width="1.2" />
    <rect x="0" y="0" width="340" height="24" rx="6" fill="#263F35" />
    
    <!-- Window controls -->
    <circle cx="12" cy="12" r="3" fill="#E06C53" />
    <circle cx="22" cy="12" r="3" fill="#E5B95A" />
    <circle cx="32" cy="12" r="3" fill="#62A375" />
    
    <!-- URL Pill -->
    <rect x="70" y="4" width="200" height="16" rx="3" fill="#1C3028" />
    <text x="170" y="15" font-family="'Aptos', sans-serif" font-size="7.5" fill="#CBB184" text-anchor="middle">🔒 momentus.events/amara-luca</text>
    
    <!-- Microsite Content Preview -->
    <text x="170" y="44" font-family="'Iowan Old Style', Georgia, serif" font-size="14" font-weight="600" fill="#263F35" text-anchor="middle" letter-spacing="0.5">Amara Santos &amp; Luca Reyes</text>
    <text x="170" y="58" font-family="'Aptos', sans-serif" font-size="8" fill="#8C5C48" text-anchor="middle" letter-spacing="1.5">COURTYARD BANQUET · CASA MANILA</text>
    
    <!-- Live RSVP Pill Tag -->
    <rect x="110" y="68" width="120" height="18" rx="9" fill="#263F35" />
    <text x="170" y="80" font-family="'Aptos', sans-serif" font-size="7.5" font-weight="700" fill="#F6F1E7" text-anchor="middle" letter-spacing="1">✓ 185 RSVPS CONFIRMED</text>
  </g>

  <!-- Realistic Camera Flare & Bokeh Highlights -->
  <circle cx="480" cy="190" r="14" fill="#FFEBBF" fill-opacity="0.18" filter="url(#w-blur)" />
  <circle cx="120" cy="220" r="22" fill="#FFC99A" fill-opacity="0.12" filter="url(#w-blur)" />
</svg>
