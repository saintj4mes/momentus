<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fr-sky" x1="0" y1="0" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#213247" />
      <stop offset="30%" stop-color="#4C6885" />
      <stop offset="60%" stop-color="#C28469" />
      <stop offset="85%" stop-color="#E8A87C" />
      <stop offset="100%" stop-color="#FCE1C2" />
    </linearGradient>
    <radialGradient id="fr-sun" cx="300" cy="180" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFDF7" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#FCDCA4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#E8A87C" stop-opacity="0" />
    </radialGradient>
    <filter id="fr-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Coastal Dawn Sky & Ocean Horizon -->
  <rect width="600" height="380" fill="url(#fr-sky)" />
  <circle cx="300" cy="180" r="140" fill="url(#fr-sun)" />

  <!-- Distant Manila Bay Ocean & Mountain Ridge Silhouette -->
  <path d="M 0 240 Q 150 220 300 230 Q 450 215 600 235 L 600 380 L 0 380 Z" fill="#293A4C" fill-opacity="0.6" />
  <rect x="0" y="248" width="600" height="24" fill="#3D5369" fill-opacity="0.5" />

  <!-- Seaside Boulevard Road & Running Track Perspective -->
  <polygon points="240,260 360,260 560,380 40,380" fill="#2B3835" />
  <!-- Road Track Lane Markings -->
  <line x1="300" y1="260" x2="300" y2="380" stroke="#FFE9A3" stroke-width="3" stroke-dasharray="14 14" opacity="0.8" />
  <line x1="260" y1="260" x2="120" y2="380" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4" />
  <line x1="340" y1="260" x2="480" y2="380" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Finish Line Gantry Arch Structure -->
  <g stroke="#C28469" stroke-width="3" fill="none">
    <!-- Gantry Posts -->
    <line x1="150" y1="270" x2="150" y2="150" stroke="#263F35" stroke-width="4" />
    <line x1="450" y1="270" x2="450" y2="150" stroke="#263F35" stroke-width="4" />
    <!-- Top Overhead Beam with Inflatable Banner -->
    <rect x="130" y="140" width="340" height="26" rx="4" fill="#A66B54" stroke="#FFF" stroke-width="1" />
    <text x="300" y="157" font-family="'Aptos', sans-serif" font-size="9" font-weight="800" fill="#FFFDF8" text-anchor="middle" letter-spacing="2">FINISH LINE · 21K / 10K / 5K</text>
    
    <!-- Official Timing Digital Clock Box -->
    <rect x="250" y="168" width="100" height="18" rx="2" fill="#141E1B" stroke="#B89B6A" stroke-width="1" />
    <text x="300" y="181" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#30E391" text-anchor="middle">01:42:18.4</text>
  </g>

  <!-- Energetic Runners in Motion Silhouettes -->
  <g fill="#141E1B">
    <!-- Runner 1 (Leading male silhouette) -->
    <g transform="translate(280, 275) scale(0.65)">
      <circle cx="15" cy="10" r="7" />
      <path d="M 12 17 L 8 45 L -2 65 L 4 67 L 14 50 L 22 68 L 29 65 L 20 42 L 25 24 Z" />
      <path d="M 8 22 L -6 32 L -3 36 L 8 28 Z" />
      <path d="M 18 22 L 32 16 L 34 20 L 22 28 Z" />
      <!-- Bib tag on chest -->
      <rect x="9" y="24" width="12" height="9" fill="#FFFDF8" rx="1" />
      <text x="15" y="31" font-family="'Aptos', sans-serif" font-size="5" font-weight="700" fill="#A66B54" text-anchor="middle">421</text>
    </g>

    <!-- Runner 2 (Following female runner silhouette) -->
    <g transform="translate(340, 285) scale(0.58)">
      <circle cx="15" cy="10" r="6.5" />
      <path d="M 13 17 L 10 44 L 2 62 L 7 64 L 16 48 L 24 66 L 30 63 L 21 40 L 24 23 Z" />
      <path d="M 10 22 L 0 30 L 3 34 L 11 27 Z" />
      <path d="M 17 22 L 30 18 L 32 22 L 20 28 Z" />
      <rect x="10" y="23" width="11" height="8" fill="#FFFDF8" rx="1" />
      <text x="15.5" y="29.5" font-family="'Aptos', sans-serif" font-size="4.5" font-weight="700" fill="#263F35" text-anchor="middle">108</text>
    </g>
  </g>

  <!-- Overlaid Realistic Client Microsite Card Frame -->
  <g transform="translate(130, 24)">
    <rect width="340" height="96" rx="6" fill="#FAF6ED" stroke="#B89B6A" stroke-width="1.2" />
    <rect x="0" y="0" width="340" height="24" rx="6" fill="#263F35" />
    <circle cx="12" cy="12" r="3" fill="#E06C53" />
    <circle cx="22" cy="12" r="3" fill="#E5B95A" />
    <circle cx="32" cy="12" r="3" fill="#62A375" />
    
    <rect x="70" y="4" width="200" height="16" rx="3" fill="#182A23" />
    <text x="170" y="15" font-family="'Aptos', sans-serif" font-size="7.5" fill="#B89B6A" text-anchor="middle">🔒 momentus.events/coastal-21k</text>
    
    <text x="170" y="44" font-family="'Iowan Old Style', Georgia, serif" font-size="14" font-weight="600" fill="#263F35" text-anchor="middle" letter-spacing="0.5">Metro Coastal 21K Half-Marathon</text>
    <text x="170" y="58" font-family="'Aptos', sans-serif" font-size="8" fill="#A66B54" text-anchor="middle" letter-spacing="1.5">SEASIDE BLVD · CHIP-TIMED WAVE A</text>
    
    <rect x="95" y="68" width="150" height="18" rx="9" fill="#A66B54" />
    <text x="170" y="80" font-family="'Aptos', sans-serif" font-size="7.5" font-weight="700" fill="#FFFDF8" text-anchor="middle" letter-spacing="1">🏃 1,450 RUNNERS CHECKED IN</text>
  </g>
</svg>
