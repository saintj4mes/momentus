<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="600" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D1F2D" />
      <stop offset="40%" stop-color="#583549" />
      <stop offset="75%" stop-color="#9C5D6F" />
      <stop offset="100%" stop-color="#E5AFB7" />
    </linearGradient>
    <radialGradient id="b-spotlight" cx="300" cy="240" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF5E8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#EAA68C" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#583549" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="b-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCEFD2" />
      <stop offset="50%" stop-color="#D9B777" />
      <stop offset="100%" stop-color="#9E763A" />
    </linearGradient>
    <filter id="b-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Ambient Ballroom Background -->
  <rect width="600" height="380" fill="url(#b-bg)" />
  <circle cx="300" cy="240" r="200" fill="url(#b-spotlight)" />

  <!-- Glass Garden Conservatoire & Arch Architecture -->
  <g stroke="#D9B777" stroke-opacity="0.3" stroke-width="1.2" fill="none">
    <!-- Steel & Glass Cathedral Arch Geometry -->
    <path d="M 60 380 L 60 210 Q 300 80 540 210 L 540 380" stroke-width="1.8" />
    <path d="M 120 380 L 120 230 Q 300 130 480 230 L 480 380" stroke-dasharray="4 4" />
    <path d="M 180 380 L 180 250 Q 300 170 420 250 L 420 380" stroke-dasharray="2 3" />
    <line x1="300" y1="100" x2="300" y2="380" stroke-opacity="0.4" />
    <line x1="60" y1="210" x2="540" y2="210" stroke-opacity="0.25" />
  </g>

  <!-- Cascading Crystal Chandelier with Golden Shimmer -->
  <g transform="translate(300, 140)">
    <!-- Chandelier Core -->
    <ellipse cx="0" cy="0" rx="48" ry="12" fill="#D9B777" fill-opacity="0.8" />
    <ellipse cx="0" cy="18" rx="34" ry="9" fill="#D9B777" fill-opacity="0.7" />
    <ellipse cx="0" cy="34" rx="20" ry="6" fill="#D9B777" fill-opacity="0.6" />
    
    <!-- Crystal Droplets Cascading Down -->
    <g stroke="#FFFDF8" stroke-width="1.2" stroke-opacity="0.8" fill="none">
      <line x1="-38" y1="6" x2="-38" y2="28" />
      <line x1="-24" y1="8" x2="-24" y2="40" />
      <line x1="-10" y1="10" x2="-10" y2="48" />
      <line x1="0" y1="12" x2="0" y2="54" />
      <line x1="10" y1="10" x2="10" y2="48" />
      <line x1="24" y1="8" x2="24" y2="40" />
      <line x1="38" y1="6" x2="38" y2="28" />
    </g>

    <!-- Glowing Crystal Light Points -->
    <circle cx="0" cy="56" r="4.5" fill="#FFFCE8" filter="url(#b-blur)" />
    <circle cx="0" cy="56" r="2.5" fill="#FFFFFF" />
    <circle cx="-24" cy="42" r="3.5" fill="#FFFCE8" filter="url(#b-blur)" />
    <circle cx="-24" cy="42" r="2" fill="#FFFFFF" />
    <circle cx="24" cy="42" r="3.5" fill="#FFFCE8" filter="url(#b-blur)" />
    <circle cx="24" cy="42" r="2" fill="#FFFFFF" />
  </g>

  <!-- Glowing Dance Floor Platform & Rose Petals Silhouette -->
  <g>
    <!-- Dance Floor Perspective Oval -->
    <ellipse cx="300" cy="315" rx="190" ry="42" fill="#1E1420" stroke="#D9B777" stroke-width="1.5" />
    <ellipse cx="300" cy="315" rx="150" ry="32" fill="#382236" fill-opacity="0.8" />
    <ellipse cx="300" cy="315" rx="100" ry="20" stroke="#FFF5E8" stroke-width="0.8" stroke-dasharray="3 3" />

    <!-- 18 Roses Celebration Silhouette Motif -->
    <g transform="translate(300, 280)">
      <!-- Central Monogram Rosette on Floor -->
      <circle cx="0" cy="32" r="14" fill="#D9B777" fill-opacity="0.4" />
      <text x="0" y="36" font-family="'Iowan Old Style', Georgia, serif" font-size="12" font-weight="700" fill="#FFFDF8" text-anchor="middle">18</text>
    </g>

    <!-- Champagne Glass Tower Toast Shimmer -->
    <g transform="translate(130, 290)">
      <path d="M 0 0 C 0 16 22 16 22 0 Z" fill="#FFE2C2" fill-opacity="0.7" stroke="#D9B777" />
      <line x1="11" y1="16" x2="11" y2="34" stroke="#D9B777" stroke-width="1.2" />
      <line x1="2" y1="34" x2="20" y2="34" stroke="#D9B777" stroke-width="1.5" />
      <circle cx="11" cy="-4" r="2" fill="#FFF5E8" />
      <circle cx="16" cy="-10" r="1.5" fill="#FFF5E8" />
    </g>
    <g transform="translate(450, 290)">
      <path d="M 0 0 C 0 16 22 16 22 0 Z" fill="#FFE2C2" fill-opacity="0.7" stroke="#D9B777" />
      <line x1="11" y1="16" x2="11" y2="34" stroke="#D9B777" stroke-width="1.2" />
      <line x1="2" y1="34" x2="20" y2="34" stroke="#D9B777" stroke-width="1.5" />
      <circle cx="11" cy="-4" r="2" fill="#FFF5E8" />
      <circle cx="6" cy="-10" r="1.5" fill="#FFF5E8" />
    </g>
  </g>

  <!-- Overlaid Realistic Client Microsite Card Frame -->
  <g transform="translate(130, 24)">
    <rect width="340" height="96" rx="6" fill="#FAF6ED" stroke="#D9B777" stroke-width="1.2" />
    <rect x="0" y="0" width="340" height="24" rx="6" fill="#382236" />
    <circle cx="12" cy="12" r="3" fill="#E06C53" />
    <circle cx="22" cy="12" r="3" fill="#E5B95A" />
    <circle cx="32" cy="12" r="3" fill="#62A375" />
    
    <rect x="70" y="4" width="200" height="16" rx="3" fill="#241423" />
    <text x="170" y="15" font-family="'Aptos', sans-serif" font-size="7.5" fill="#D9B777" text-anchor="middle">🔒 momentus.events/mikaela-debut</text>
    
    <text x="170" y="44" font-family="'Iowan Old Style', Georgia, serif" font-size="14" font-weight="600" fill="#263F35" text-anchor="middle" letter-spacing="0.5">Mikaela Cruz · The 18th Debut</text>
    <text x="170" y="58" font-family="'Aptos', sans-serif" font-size="8" fill="#9C5D6F" text-anchor="middle" letter-spacing="1.5">COMMEMORATIVE BALL · THE GLASS GARDEN</text>
    
    <rect x="105" y="68" width="130" height="18" rx="9" fill="#9C5D6F" />
    <text x="170" y="80" font-family="'Aptos', sans-serif" font-size="7.5" font-weight="700" fill="#FFFDF8" text-anchor="middle" letter-spacing="1">✓ 320 GUESTS · 18 ROSES</text>
  </g>

  <!-- Golden Sparkle Bokeh Flakes -->
  <circle cx="100" cy="160" r="3" fill="#FFFDF8" filter="url(#b-blur)" />
  <circle cx="500" cy="170" r="3.5" fill="#FFFDF8" filter="url(#b-blur)" />
  <circle cx="210" cy="180" r="2" fill="#D9B777" />
  <circle cx="390" cy="180" r="2" fill="#D9B777" />
</svg>
